<script>
(() => {
"use strict";

const API_URL = window.location.origin;

let usuario = null;
let authMode = "login";
let categoriaAtual = "";
let produtoAtual = null;
let emailParaVerificacao = "";
let searchTimer = null;


/* =========================================================
   UTILIDADES
========================================================= */

const $ = id => document.getElementById(id);

function token() {
    return localStorage.getItem("slaxstore_token") || "";
}

function salvarToken(value) {
    if (value) {
        localStorage.setItem("slaxstore_token", value);
    }
}

function removerToken() {
    localStorage.removeItem("slaxstore_token");
}

function texto(value) {
    return String(value ?? "");
}

function escapeHTML(value) {
    return texto(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function dinheiro(cents) {
    return (Number(cents || 0) / 100).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );
}

function mostrar(elemento, mostrar = true) {
    if (!elemento) return;

    elemento.classList.toggle(
        "hidden",
        !mostrar
    );

    if (!mostrar) {
        elemento.style.display = "none";
    } else {
        elemento.style.display = "";
    }
}

function abrirModal(id) {
    const elemento = $(id);

    if (!elemento) return false;

    mostrar(elemento, true);
    return true;
}

function fecharModal(id) {
    const elemento = $(id);

    if (!elemento) return;

    mostrar(elemento, false);
}

function mensagem(elemento, msg, tipo = "error") {
    if (!elemento) {
        alert(msg);
        return;
    }

    elemento.textContent = msg;
    elemento.className =
        "message " + tipo;

    elemento.style.display = "block";
}


/* =========================================================
   API
========================================================= */

async function api(endpoint, options = {}) {

    const headers = {
        ...(options.body
            ? {
                "Content-Type":
                    "application/json"
            }
            : {}),
        ...(options.headers || {})
    };

    const authToken = token();

    if (authToken) {
        headers.Authorization =
            "Bearer " + authToken;
    }

    const resposta = await fetch(
        API_URL + endpoint,
        {
            ...options,
            credentials: "include",
            headers
        }
    );

    let dados = {};

    try {
        dados = await resposta.json();
    } catch {
        dados = {};
    }

    if (!resposta.ok) {

        if (
            resposta.status === 401 &&
            !endpoint.includes("/login") &&
            !endpoint.includes("/register")
        ) {
            usuario = null;
            removerToken();
            atualizarInterface();
        }

        throw new Error(
            dados.error ||
            dados.message ||
            "Erro no servidor."
        );
    }

    return dados;
}


/* =========================================================
   SESSÃO
========================================================= */

async function verificarSessao() {

    const authToken = token();

    if (!authToken) {
        usuario = null;
        atualizarInterface();
        return;
    }

    try {

        const resposta =
            await api("/api/auth/me");

        usuario =
            resposta.user ||
            resposta.usuario ||
            null;

        if (!usuario) {
            removerToken();
        }

    } catch {

        usuario = null;
        removerToken();
    }

    atualizarInterface();
}


/* =========================================================

function abrirAuth(modo = "login") {

    authMode = modo;

    const modal =
        $("authModal");

    if (!modal) {
        alert(
            "O modal de login não existe no HTML."
        );
        return;
    }

    const title =
        $("authTitle");

    const usernameField =
        $("usernameField");

    const submit =
        $("authSubmit");

    const switchText =
        $("authSwitchText");

    const switchButton =
        $("authSwitch");

    if (title) {
        title.textContent =
            modo === "register"
                ? "Criar conta"
                : "Entrar";
    }

    if (usernameField) {
        usernameField.classList.toggle(
            "hidden",
            modo !== "register"
        );

        usernameField.style.display =
            modo === "register"
                ? ""
                : "none";
    }

    if (submit) {
        submit.textContent =
            modo === "register"
                ? "Criar conta"
                : "Entrar";
    }

    if (switchText) {
        switchText.textContent =
            modo === "register"
                ? "Já possui uma conta?"
                : "Ainda não tem uma conta?";
    }

    if (switchButton) {
        switchButton.textContent =
            modo === "register"
                ? "Entrar"
                : "Criar conta";
    }

    const msg =
        $("authMessage");

    if (msg) {
        msg.textContent = "";
        msg.style.display = "none";
    }

    abrirModal("authModal");
}

function alternarAuth() {
    abrirAuth(
        authMode === "login"
            ? "register"
            : "login"
    );
}


/* =========================================================
   FORM LOGIN
========================================================= */

function configurarLogin() {

    const form =
        $("authForm");

    if (!form) return;

    form.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const msg =
                $("authMessage");

            try {

                const email =
                    ($("email")?.value || "")
                        .trim()
                        .toLowerCase();

                const password =
                    $("password")?.value || "";

                if (!email) {
                    throw new Error(
                        "Digite seu e-mail."
                    );
                }

                if (!password) {
                    throw new Error(
                        "Digite sua senha."
                    );
                }


                /* =====================
                   CADASTRO
                ===================== */

                if (
                    authMode === "register"
                ) {

                    const username =
                        ($("username")?.value || "")
                            .trim();

                    if (!username) {
                        throw new Error(
                            "Digite seu nome de usuário."
                        );
                    }

                    emailParaVerificacao =
                        email;

                    await api(
                        "/api/auth/register",
                        {
                            method: "POST",
                            body:
                                JSON.stringify({
                                    username,
                                    email,
                                    password
                                })
                        }
                    );

                    const textoVerificacao =
                        $("verifyEmailText");

                    if (textoVerificacao) {
                        textoVerificacao.textContent =
                            "Enviamos um código para " +
                            email + ".";
                    }

                    const codigo =
                        $("verificationCode");

                    if (codigo) {
                        codigo.value = "";
                    }

                    fecharModal(
                        "authModal"
                    );

                    abrirModal(
                        "verifyModal"
                    );

                    return;
                }


                /* =====================
                   LOGIN
                ===================== */

                const resposta =
                    await api(
                        "/api/auth/login",
                        {
                            method: "POST",
                            body:
                                JSON.stringify({
                                    email,
                                    password
                                })
                        }
                    );

                if (!resposta.token) {
                    throw new Error(
                        "O servidor não enviou o token."
                    );
                }

                salvarToken(
                    resposta.token
                );

                usuario =
                    resposta.user ||
                    resposta.usuario;

                if (!usuario) {
                    throw new Error(
                        "Usuário não retornado pelo servidor."
                    );
                }

                fecharModal(
                    "authModal"
                );

                atualizarInterface();

                await carregarProdutos();

            } catch (erro) {

                mensagem(
                    msg,
                    erro.message
                );
            }
        }
    );
}


/* =========================================================

========================================================= */

function configurarVerificacao() {

    const form =
        $("verifyForm");

    if (!form) return;

    form.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const msg =
                $("verifyMessage");

            try {

                const code =
                    ($("verificationCode")?.value || "")
                        .trim();

                if (!/^\d{6}$/.test(code)) {
                    throw new Error(
                        "Digite os 6 números do código."
                    );
                }

                const resposta =
                    await api(
                        "/api/auth/verify-email",
                        {
                            method: "POST",
                            body:
                                JSON.stringify({
                                    email:
                                        emailParaVerificacao,
                                    code
                                })
                        }
                    );

                mensagem(
                    msg,
                    resposta.message ||
                    "E-mail verificado.",
                    "success"
                );

                setTimeout(() => {

                    fecharModal(
                        "verifyModal"
                    );

                    abrirAuth(
                        "login"
                    );

                }, 1000);

            } catch (erro) {

                mensagem(
                    msg,
                    erro.message
                );
            }
        }
    );
}

async function reenviarCodigo() {

    try {

        if (!emailParaVerificacao) {
            throw new Error(
                "Nenhum e-mail para reenviar."

        }

        const resposta =
            await api(

        mensagem(

}

async function carregarProdutos() {

    const container =
        $("products");

    if (!container) {
        return;
    }

    container.innerHTML =
        `
        <div class="empty">
            Carregando produtos...
        </div>
        `;

    const pesquisa =
        ($("searchInput")?.value || "")
            .trim();

    try {

        const params =
            new URLSearchParams();

        params.set(
            "page",
            "1"
        );

        params.set(
            "limit",
            "40"
        );

        if (pesquisa) {
            params.set(
                "search",
                pesquisa
            );
        }

        if (categoriaAtual) {
            params.set(
                "category",
                categoriaAtual
            );
        }

        const resposta =
            await api(
                "/api/products?" +
                params.toString()
            );

        const produtos =
            resposta.products ||
            resposta.items ||
            [];

        const contador =
            $("productCount");

        if (contador) {
            contador.textContent =
                `${produtos.length} produto(s)`;
        }

        if (!produtos.length) {

            container.innerHTML =
                `
                <div class="empty">
                    Nenhum anúncio disponível.
                </div>
                `;

            return;
        }

        container.innerHTML =
            produtos
                .map(criarCardProduto)
                .join("");

    } catch (erro) {

        container.innerHTML =
            `
            <div class="empty">
                Nenhum anúncio disponível.
            </div>
            `;
    }
}

function criarCardProduto(produto) {

    return `

            <div class="product-image">

                ${
                    produto.image_url
                        ? `
                            <img
                                src="${escapeHTML(
                                    produto.image_url
                                )}"
                                alt=""
                            >
                        `
                        : `
                            <span>SLAX</span>
                        `
                }

            </div>

            <div class="product-content">

                <div class="product-category">
                    ${escapeHTML(
                        produto.category
                    )}
                </div>

                <div class="product-title">
                    ${escapeHTML(
                        produto.title
                    )}
                </div>

                <div class="product-description">
                    ${escapeHTML(
                        produto.description
                    )}
                </div>

                <div class="product-bottom">

                    <div class="price">
                        ${dinheiro(
                            produto.price_cents
                        )}
                    </div>

                    <button
                        type="button"
                        class="buy"
                        onclick="abrirProduto(${produto.id})"
                    >
                        Ver

                </div>

            </div>

        </article>
    `;
}

async function comprarProduto(id) {

    if (!usuario) {

        fecharModal(
            "productModal"
        );

        abrirAuth(
            "login"
        );

        return;
    }

    if (
        !confirm(
            "Deseja criar este pedido?"
        )
    ) {
        return;
    }

    try {

        const resposta =
            await api(
                "/api/orders/" + id,
                {
                    method: "POST"
                }
            );

        alert(
            resposta.message ||
            "Pedido criado."
        );

        fecharModal(
            "productModal"
        );

        carregarProdutos();

    } catch (erro) {

        alert(
            erro.message
        );
    }
}

async function salvarPerfil(event) {

    const msg =
        $("slaxProfileMessage");

    try {

            $("slaxProfileUsername")
                .value
                .trim();

        const bio =
            $("slaxProfileBio")
                .value;

        const avatar_url =
            $("slaxProfileAvatar")
                .value
                .trim();

        const resposta =
            await api(
                "/api/auth/profile",

                    method: "PUT",
                    body:
                        JSON.stringify({
                            username,
                            bio,
                            avatar_url
                        })
                }
            );

            resposta.user ||
            usuario;

        mensagem(
            msg,
            "Perfil salvo com sucesso.",
            "success"
        );

        atualizarInterface();

    } catch (erro) {

        mensagem(
            msg,
            erro.message
        );
    }
}

async function criarAnuncio(event) {

    event.preventDefault();

    const msg =
        $("slaxProductMessage");

    try {

        const title =
            $("slaxProductTitle")
                .value
                .trim();

        const description =
            $("slaxProductDescription")
                .value
                .trim();

        const category =
            $("slaxProductCategory")
                .value;

        const price =
            Number(
                $("slaxProductPrice")
                    .value
            );

        const stock =
            Number(
                $("slaxProductStock")
                    .value
            );

        const image_url =
            $("slaxProductImage")
                .value
                .trim();

        if (!title) {
            throw new Error(
                "Digite o título."
            );
        }

        if (!description) {
            throw new Error(
                "Digite a descrição."
            );
        }

        if (
            !Number.isFinite(price) ||
            price < 0.97
        ) {
            throw new Error(
                "O preço mínimo é R$ 0,97."
            );
        }

        if (
            !Number.isInteger(stock) ||
            stock < 1
        ) {
            throw new Error(
                "Estoque inválido."
            );
        }

        const resposta =
            await api(
                "/api/products",
                {
                    method: "POST",
                    body:
                        JSON.stringify({
                            title,
                            description,
                            category,
                            price_cents:
                                Math.round(
                                    price * 100
                                ),
                            image_url:
                                image_url || null,
                            stock,
                            delivery_type:
                                "manual"
                        })
                }
            );

        mensagem(
            msg,
            resposta.message ||
            "Anúncio enviado para análise.",
            "success"
        );

        setTimeout(() => {

            fecharModal(
                "productModal"
            );

            carregarProdutos();

        }, 1200);

    } catch (erro) {

        mensagem(
            msg,
            erro.message
        );
    }
}


/* =========================================================
   PESQUISA
========================================================= */

function configurarPesquisa() {

    const input =
        $("searchInput");

    if (!input) return;

    input.addEventListener(
        "input",
        () => {

            clearTimeout(
                searchTimer
            );

            searchTimer =
                setTimeout(
                    carregarProdutos,
                    300
                );
        }
    );
}


/* =========================================================
   FUNÇÕES GLOBAIS
========================================================= */

window.abrirAuth =
    abrirAuth;

window.alternarAuth =
    alternarAuth;

window.logout =
    logout;

window.abrirPerfil =
    abrirPerfil;

window.abrirProduto =
    abrirProduto;

window.comprarProduto =
    comprarProduto;

window.selecionarCategoria =
    selecionarCategoria;

window.abrirCriarAnuncio =
    abrirCriarAnuncio;

window.reenviarCodigo =
    reenviarCodigo;

window.carregarProdutos =
    carregarProdutos;


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

function iniciar() {

    configurarLogin();

    configurarVerificacao();

    configurarPesquisa();

    verificarSessao()
        .then(() => {
            carregarProdutos();
        })
        .catch(() => {
            carregarProdutos();
        });
}

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        iniciar
    );

} else {

    iniciar();
}

})();
