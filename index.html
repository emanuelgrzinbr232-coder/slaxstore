<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SlaxStore — Marketplace Gamer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #05070d;
            --panel: #0b101a;
            --panel2: #101827;
            --border: #1c2b42;
            --blue: #1683ff;
            --blue2: #0066ff;
            --text: #f4f7ff;
            --muted: #8c9ab0;
            --danger: #ff405d;
            --success: #25d989;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(0, 119, 255, .18),
                    transparent 40%
                ),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 7, 13, .94);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1250px;
            margin: auto;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            white-space: nowrap;
        }

        .logo span {
            color: var(--blue);
        }

        .search {
            flex: 1;
        }

        .search input {
            width: 100%;
            padding: 13px 17px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #0b111d;
            color: white;
            outline: none;
        }

        .search input:focus {
            border-color: var(--blue);
        }

        .nav {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .nav button {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 9px 11px;
            border-radius: 8px;
        }

        .nav button:hover {
            color: white;
            background: #101827;
        }

        .primary {
            background: var(--blue) !important;
            color: white !important;
            font-weight: bold;
        }

        .primary:hover {
            background: var(--blue2) !important;
        }

        main {
            max-width: 1250px;
            margin: auto;
            padding: 30px 20px 70px;
        }

        .hero {
            padding: 55px 30px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background:
                linear-gradient(
                    135deg,
                    rgba(16, 31, 54, .95),
                    rgba(6, 10, 18, .95)
                );
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: clamp(34px, 6vw, 60px);
            line-height: 1;
            margin-bottom: 16px;
        }

        .hero h1 span {
            color: var(--blue);
        }

        .hero p {
            color: var(--muted);
            max-width: 650px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .hero-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: 1px solid var(--border);
            background: #0d1523;
            color: white;
            padding: 11px 17px;
            border-radius: 9px;
            font-weight: bold;
        }

        .btn:hover {
            border-color: var(--blue);
        }

        .filters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 20px;
        }

        .filter {
            white-space: nowrap;
            border: 1px solid var(--border);
            background: #0b111d;
            color: var(--muted);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .filter.active,
        .filter:hover {
            background: rgba(22, 131, 255, .12);
            border-color: var(--blue);
            color: white;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-title h2 {
            font-size: 22px;
        }

        .section-title span {
            color: var(--muted);
            font-size: 13px;
        }

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .product {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 13px;
            overflow: hidden;
            transition: .2s;
        }

        .product:hover {
            transform: translateY(-3px);
            border-color: #27558d;
        }

        .product-image {
            width: 100%;
            height: 150px;
            background:
                linear-gradient(
                    135deg,
                    #101a2c,
                    #070b12
                );
            display: flex;
            align-items: center;
            justify-content: center;
            color: #53627a;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-content {
            padding: 14px;
        }

        .product-category {
            color: var(--blue);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .product-title {
            font-weight: bold;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-description {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.4;
            height: 37px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .price {
            font-weight: 900;
            font-size: 18px;
        }

        .buy {
            background: var(--blue);
            color: white;
            border: 0;
            padding: 8px 11px;
            border-radius: 7px;
            font-weight: bold;
        }

        .buy:hover {
            background: var(--blue2);
        }

        .empty {
            padding: 50px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 12px;
            grid-column: 1 / -1;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: rgba(0, 0, 0, .75);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            background: #0a101b;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 24px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, .6);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-head h2 {
            font-size: 22px;
        }

        .close {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 27px;
        }

        .form {
            display: grid;
            gap: 13px;
        }

        .form label {
            color: #cbd5e5;
            font-size: 13px;
            font-weight: bold;
        }

        .form input,
        .form textarea,
        .form select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #070c14;
            color: white;
            outline: none;
        }

        .form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form input:focus,
        .form textarea:focus,
        .form select:focus {
            border-color: var(--blue);
        }

        .message {
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
        }

        .message.error {
            background: rgba(255, 64, 93, .1);
            color: #ff8295;
            border: 1px solid rgba(255, 64, 93, .25);
        }

        .message.success {
            background: rgba(37, 217, 137, .1);
            color: #66e5ab;
            border: 1px solid rgba(37, 217, 137, .25);
        }

        .profile {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #13233a;
            border: 2px solid var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 28px;
            font-weight: bold;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info h3 {
            margin-bottom: 4px;
        }

        .profile-info p {
            color: var(--muted);
            font-size: 13px;
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 25px 20px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            .header-inner {
                flex-wrap: wrap;
            }

            .search {
                order: 3;
                flex-basis: 100%;
            }

            .nav {
                margin-left: auto;
            }

            .hero {
                padding: 35px 20px;
            }
        }

        @media (max-width: 500px) {
            main {
                padding: 20px 12px 50px;
            }

            .products {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 9px;
            }

            .product-image {
                height: 110px;
            }

            .product-content {
                padding: 10px;
            }

            .product-title {
                font-size: 14px;
            }

            .price {
                font-size: 15px;
            }

            .buy {
                font-size: 11px;
                padding: 7px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            Slax<span>Store</span>
        </div>

        <div class="search">
            <input
                id="searchInput"
                type="search"
                placeholder="Pesquisar produtos..."
            >
        </div>

        <nav class="nav">

            <button onclick="carregarProdutos()">
                Explorar
            </button>

            <button
                id="loginButton"
                class="primary"
                onclick="abrirAuth('login')"
            >
                Entrar
            </button>

            <button
                id="profileButton"
                class="hidden"
                onclick="abrirPerfil()"
            >
                Perfil
            </button>

            <button
                id="logoutButton"
                class="hidden"
                onclick="logout()"
            >
                Sair
            </button>

        </nav>

    </div>
</header>

<main>

    <section class="hero">

        <h1>
            O marketplace<br>
            <span>gamer.</span>
        </h1>

        <p>
            Compre e venda produtos e serviços para jogos
            em um marketplace feito para gamers.
        </p>

        <div class="hero-actions">

            <button
                class="btn primary"
                onclick="
                    document
                    .getElementById('marketplace')
                    .scrollIntoView({
                        behavior:'smooth'
                    })
                "
            >
                Explorar produtos
            </button>

            <button
                class="btn"
                onclick="abrirAuth('register')"
            >
                Criar conta
            </button>

        </div>

    </section>

    <section id="marketplace">

        <div class="filters">

            <button
                class="filter active"
                data-category=""
                onclick="selecionarCategoria(this)"
            >
                Todos
            </button>

            <button
                class="filter"
                data-category="Contas"
                onclick="selecionarCategoria(this)"
            >
                Contas
            </button>

            <button
                class="filter"
                data-category="Itens"
                onclick="selecionarCategoria(this)"
            >
                Itens
            </button>

            <button
                class="filter"
                data-category="Serviços"
                onclick="selecionarCategoria(this)"
            >
                Serviços
            </button>

            <button
                class="filter"
                data-category="Outros"
                onclick="selecionarCategoria(this)"
            >
                Outros
            </button>

        </div>

        <div class="section-title">

            <h2>
                Produtos disponíveis
            </h2>

            <span id="productCount">
                Carregando...
            </span>

        </div>

        <div
            id="products"
            class="products"
        ></div>

    </section>

</main>

<footer>
    SlaxStore © 2026 — Marketplace Gamer
</footer>

<!-- LOGIN / CADASTRO -->

<div
    id="authModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-head">

            <h2 id="authTitle">
                Entrar
            </h2>

            <button
                class="close"
                onclick="fecharModal('authModal')"
            >
                ×
            </button>

        </div>

        <form
            id="authForm"
            class="form"
        >

            <div
                id="usernameField"
                class="hidden"
            >
                <label>
                    Usuário

                    <input
                        id="username"
                        type="text"
                        maxlength="30"
                        autocomplete="username"
                    >
                </label>
            </div>

            <label>
                E-mail

                <input
                    id="email"
                    type="email"
                    required
                    autocomplete="email"
                >
            </label>

            <label>
                Senha

                <input
                    id="password"
                    type="password"
                    required
                    minlength="6"
                    autocomplete="current-password"
                >
            </label>

            <div
                id="authMessage"
                class="hidden"
            ></div>

            <button
                id="authSubmit"
                class="btn primary"
                type="submit"
            >
                Entrar
            </button>

        </form>

        <div
            style="
                text-align:center;
                margin-top:15px;
                color:#8c9ab0;
                font-size:13px;
            "
        >

            <span id="authSwitchText">
                Ainda não tem uma conta?
            </span>

            <button
                id="authSwitch"
                onclick="alternarAuth()"
                style="
                    border:0;
                    background:none;
                    color:#1683ff;
                    cursor:pointer;
                "
            >
                Criar conta
            </button>

        </div>

    </div>

</div>

<!-- VERIFICAÇÃO -->

<div
    id="verifyModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-head">

            <h2>
                Verificar e-mail
            </h2>

            <button
                class="close"
                onclick="fecharModal('verifyModal')"
            >
                ×
            </button>

        </div>

        <p
            id="verifyEmailText"
            style="
                color:#8c9ab0;
                font-size:13px;
                margin-bottom:15px;
                line-height:1.5;
            "
        >
        </p>

        <form
            id="verifyForm"
            class="form"
        >

            <label>
                Código recebido por e-mail

                <input
                    id="verificationCode"
                    type="text"
                    maxlength="6"
                    minlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder="000000"
                    required
                >
            </label>

            <div
                id="verifyMessage"
                class="hidden"
            ></div>

            <button
                class="btn primary"
                type="submit"
            >
                Verificar e-mail
            </button>

        </form>

        <button
            class="btn"
            style="
                width:100%;
                margin-top:10px;
            "
            onclick="reenviarCodigo()"
        >
            Reenviar código
        </button>

    </div>

</div>

<!-- PRODUTO -->

<div
    id="productModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-head">

            <h2 id="productModalTitle">
                Produto
            </h2>

            <button
                class="close"
                onclick="fecharModal('productModal')"
            >
                ×
            </button>

        </div>

        <div id="productDetails"></div>

    </div>

</div>

<!-- PERFIL -->

<div
    id="profileModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-head">

            <h2>
                Meu perfil
            </h2>

            <button
                class="close"
                onclick="fecharModal('profileModal')"
            >
                ×
            </button>

        </div>

        <div id="profileContent"></div>

    </div>

</div>

<script>

const API_URL = window.location.origin;

let usuario = null;
let authMode = "login";
let categoriaAtual = "";
let produtoAtual = null;

/*
    ESTE É O E-MAIL QUE ESTÁ SENDO VERIFICADO.
    Ele fica separado do formulário de login.
*/
let emailParaVerificacao = "";

let searchTimer = null;


/* =========================
   API
========================= */

async function api(endpoint, options = {}) {

    const config = {
        credentials: "include",
        ...options,
        headers: {
            ...(options.body
                ? {
                    "Content-Type":
                        "application/json"
                }
                : {}),
            ...(options.headers || {})
        }
    };

    const resposta =
        await fetch(
            API_URL + endpoint,
            config
        );

    let dados = {};

    try {
        dados =
            await resposta.json();
    } catch {
        dados = {};
    }

    if (!resposta.ok) {

        throw new Error(
            dados.error ||
            dados.message ||
            "Ocorreu um erro."
        );
    }

    return dados;
}


/* =========================
   SEGURANÇA HTML
========================= */

function escapeHTML(valor) {

    return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================
   DINHEIRO
========================= */

function dinheiro(cents) {

    return (
        Number(cents || 0) / 100
    ).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );
}


/* =========================
   MODAIS
========================= */

function abrirModal(id) {

    document
        .getElementById(id)
        .classList.remove("hidden");
}


function fecharModal(id) {

    document
        .getElementById(id)
        .classList.add("hidden");
}


/* =========================
   MENSAGENS
========================= */

function mostrarMensagem(
    elemento,
    texto,
    tipo = "error"
) {

    elemento.className =
        "message " + tipo;

    elemento.textContent =
        texto;
}


/* =========================
   LOGIN / CADASTRO
========================= */

function abrirAuth(modo) {

    authMode = modo;

    const title =
        document.getElementById(
            "authTitle"
        );

    const usernameField =
        document.getElementById(
            "usernameField"
        );

    const submit =
        document.getElementById(
            "authSubmit"
        );

    const switchText =
        document.getElementById(
            "authSwitchText"
        );

    const switchButton =
        document.getElementById(
            "authSwitch"
        );

    const message =
        document.getElementById(
            "authMessage"
        );

    message.className =
        "hidden";

    if (modo === "register") {

        title.textContent =
            "Criar conta";

        usernameField.classList.remove(
            "hidden"
        );

        submit.textContent =
            "Criar conta";

        switchText.textContent =
            "Já possui uma conta?";

        switchButton.textContent =
            "Entrar";

    } else {

        title.textContent =
            "Entrar";

        usernameField.classList.add(
            "hidden"
        );

        submit.textContent =
            "Entrar";

        switchText.textContent =
            "Ainda não tem uma conta?";

        switchButton.textContent =
            "Criar conta";
    }

    abrirModal("authModal");
}


function alternarAuth() {

    abrirAuth(
        authMode === "login"
            ? "register"
            : "login"
    );
}


/* =========================
   SUBMIT LOGIN/CADASTRO
========================= */

document
    .getElementById("authForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const message =
                document.getElementById(
                    "authMessage"
                );

            message.className =
                "hidden";

            try {

                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim()
                        .toLowerCase();

                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;

                /* =====================
                   CADASTRO
                ===================== */

                if (
                    authMode === "register"
                ) {

                    const username =
                        document
                            .getElementById(
                                "username"
                            )
                            .value
                            .trim();

                    if (!username) {

                        throw new Error(
                            "Informe seu usuário."
                        );
                    }

                    /*
                        GUARDA O E-MAIL
                        ANTES DE ABRIR
                        O MODAL DE VERIFICAÇÃO.
                    */

                    emailParaVerificacao =
                        email;

                    const resposta =
                        await api(
                            "/api/auth/register",
                            {
                                method: "POST",

                                body:
                                    JSON.stringify({
                                        username,
                                        email,
                                        password
                                    })
                            }
                        );

                    mostrarMensagem(
                        message,
                        resposta.message ||
                        "Conta criada. Verifique seu e-mail.",
                        "success"
                    );

                    /*
                        NÃO DEPENDEMOS MAIS
                        DO INPUT DO LOGIN.
                    */

                    document
                        .getElementById(
                            "verifyEmailText"
                        )
                        .textContent =
                        "Enviamos um código para " +
                        emailParaVerificacao +
                        ".";

                    document
                        .getElementById(
                            "verificationCode"
                        )
                        .value = "";

                    setTimeout(
                        function() {

                            fecharModal(
                                "authModal"
                            );

                            abrirModal(
                                "verifyModal"
                            );

                        },
                        700
                    );

                    return;
                }


                /* =====================
                   LOGIN
                ===================== */

                const resposta =
                    await api(
                        "/api/auth/login",
                        {
                            method: "POST",

                            body:
                                JSON.stringify({
                                    email,
                                    password
                                })
                        }
                    );

                usuario =
                    resposta.user ||
                    resposta.usuario ||
                    null;

                atualizarInterface();

                fecharModal(
                    "authModal"
                );

                carregarProdutos();

            } catch (erro) {

                mostrarMensagem(
                    message,
                    erro.message
                );
            }
        }
    );


/* =========================
   VERIFICAR E-MAIL
========================= */

document
    .getElementById("verifyForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const message =
                document.getElementById(
                    "verifyMessage"
                );

            message.className =
                "hidden";

            try {

                /*
                    IMPORTANTE:
                    usamos a variável salva
                    durante o cadastro.
                */

                const email =
                    emailParaVerificacao
                        .trim()
                        .toLowerCase();

                const code =
                    document
                        .getElementById(
                            "verificationCode"
                        )
                        .value
                        .trim();

                if (!email) {

                    throw new Error(
                        "O e-mail da verificação não foi encontrado. Faça o cadastro novamente."
                    );
                }

                if (!/^\d{6}$/.test(code)) {

                    throw new Error(
                        "Informe um código de 6 números."
                    );
                }

                const resposta =
                    await api(
                        "/api/auth/verify-email",
                        {
                            method: "POST",

                            body:
                                JSON.stringify({
                                    email,
                                    code
                                })
                        }
                    );

                mostrarMensagem(
                    message,
                    resposta.message ||
                    "E-mail verificado com sucesso!",
                    "success"
                );

                setTimeout(
                    function() {

                        fecharModal(
                            "verifyModal"
                        );

                        /*
                            Coloca o e-mail
                            automaticamente
                            no login.
                        */

                        document
                            .getElementById(
                                "email"
                            )
                            .value =
                            emailParaVerificacao;

                        document
                            .getElementById(
                                "password"
                            )
                            .value = "";

                        abrirAuth(
                            "login"
                        );

                    },
                    1000
                );

            } catch (erro) {

                mostrarMensagem(
                    message,
                    erro.message
                );
            }
        }
    );


/* =========================
   REENVIAR CÓDIGO
========================= */

async function reenviarCodigo() {

    const message =
        document.getElementById(
            "verifyMessage"
        );

    try {

        const email =
            emailParaVerificacao
                .trim()
                .toLowerCase();

        if (!email) {

            throw new Error(
                "O e-mail não foi encontrado."
            );
        }

        const resposta =
            await api(
                "/api/auth/resend-code",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            email
                        })
                }
            );

        mostrarMensagem(
            message,
            resposta.message ||
            "Novo código enviado.",
            "success"
        );

    } catch (erro) {

        mostrarMensagem(
            message,
            erro.message
        );
    }
}


/* =========================
   SESSÃO
========================= */

async function verificarSessao() {

    try {

        const resposta =
            await api(
                "/api/auth/me"
            );

        usuario =
            resposta.user ||
            resposta.usuario ||
            null;

    } catch {

        usuario = null;
    }

    atualizarInterface();
}


function atualizarInterface() {

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const profileButton =
        document.getElementById(
            "profileButton"
        );

    const logoutButton =
        document.getElementById(
            "logoutButton"
        );

    if (usuario) {

        loginButton.classList.add(
            "hidden"
        );

        profileButton.classList.remove(
            "hidden"
        );

        logoutButton.classList.remove(
            "hidden"
        );

    } else {

        loginButton.classList.remove(
            "hidden"
        );

        profileButton.classList.add(
            "hidden"
        );

        logoutButton.classList.add(
            "hidden"
        );
    }
}


/* =========================
   LOGOUT
========================= */

async function logout() {

    try {

        await api(
            "/api/auth/logout",
            {
                method: "POST"
            }
        );

    } catch {}

    usuario = null;

    atualizarInterface();

    carregarProdutos();
}


/* =========================
   CATEGORIAS
========================= */

function selecionarCategoria(
    botao
) {

    document
        .querySelectorAll(".filter")
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    botao.classList.add(
        "active"
    );

    categoriaAtual =
        botao.dataset.category ||
        "";

    carregarProdutos();
}


/* =========================
   PRODUTOS
========================= */

async function carregarProdutos() {

    const container =
        document.getElementById(
            "products"
        );

    const count =
        document.getElementById(
            "productCount"
        );

    const pesquisa =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim();

    container.innerHTML =
        `
        <div class="empty">
            Carregando produtos...
        </div>
        `;

    try {

        const params =
            new URLSearchParams();

        params.set(
            "page",
            "1"
        );

        params.set(
            "limit",
            "40"
        );

        if (pesquisa) {

            params.set(
                "search",
                pesquisa
            );
        }

        if (categoriaAtual) {

            params.set(
                "category",
                categoriaAtual
            );
        }

        const resposta =
            await api(
                "/api/products?" +
                params.toString()
            );

        const produtos =
            resposta.products ||
            resposta.items ||
            [];

        count.textContent =
            `${produtos.length} produto(s)`;

        if (!produtos.length) {

            container.innerHTML =
                `
                <div class="empty">
                    Nenhum produto encontrado.
                </div>
                `;

            return;
        }

        container.innerHTML =
            produtos
                .map(
                    produto =>
                        criarCardProduto(
                            produto
                        )
                )
                .join("");

    } catch (erro) {

        container.innerHTML =
            `
            <div class="empty">
                Não foi possível carregar os produtos.<br><br>
                ${escapeHTML(
                    erro.message
                )}
            </div>
            `;
    }
}


function criarCardProduto(
    produto
) {

    const imagem =
        produto.image_url;

    return `
        <article class="product">

            <div class="product-image">

                ${
                    imagem
                        ? `
                            <img
                                src="${escapeHTML(
                                    imagem
                                )}"
                                alt=""
                                onerror="
                                    this.style.display='none'
                                "
                            >
                        `
                        : `
                            <span>
                                SLAX
                            </span>
                        `
                }

            </div>

            <div class="product-content">

                <div class="product-category">
                    ${escapeHTML(
                        produto.category
                    )}
                </div>

                <div class="product-title">
                    ${escapeHTML(
                        produto.title
                    )}
                </div>

                <div class="product-description">
                    ${escapeHTML(
                        produto.description
                    )}
                </div>

                <div class="product-bottom">

                    <div class="price">
                        ${dinheiro(
                            produto.price_cents
                        )}
                    </div>

                    <button
                        class="buy"
                        onclick="
                            abrirProduto(
                                ${produto.id}
                            )
                        "
                    >
                        Ver
                    </button>

                </div>

            </div>

        </article>
    `;
}


/* =========================
   DETALHES DO PRODUTO
========================= */

async function abrirProduto(id) {

    const details =
        document.getElementById(
            "productDetails"
        );

    details.innerHTML =
        `
        <div class="empty">
            Carregando...
        </div>
        `;

    abrirModal(
        "productModal"
    );

    try {

        const resposta =
            await api(
                "/api/products/" +
                id
            );

        produtoAtual =
            resposta.product ||
            resposta;

        const p =
            produtoAtual;

        document.getElementById(
            "productModalTitle"
        ).textContent =
            p.title;

        details.innerHTML =
            `
            ${
                p.image_url
                    ? `
                        <img
                            src="${escapeHTML(
                                p.image_url
                            )}"
                            style="
                                width:100%;
                                max-height:260px;
                                object-fit:cover;
                                border-radius:10px;
                                margin-bottom:15px;
                            "
                        >
                    `
                    : ""
            }

            <div class="product-category">
                ${escapeHTML(
                    p.category
                )}
            </div>

            <h3
                style="
                    margin-bottom:10px;
                "
            >
                ${escapeHTML(
                    p.title
                )}
            </h3>

            <p
                style="
                    color:#9aa8bc;
                    line-height:1.6;
                    margin-bottom:15px;
                "
            >
                ${escapeHTML(
                    p.description
                )}
            </p>

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:15px;
                    margin-bottom:18px;
                "
            >

                <strong
                    style="
                        font-size:25px;
                    "
                >
                    ${dinheiro(
                        p.price_cents
                    )}
                </strong>

                <span
                    style="
                        color:#8c9ab0;
                        font-size:12px;
                    "
                >
                    Estoque:
                    ${Number(
                        p.stock || 0
                    )}
                </span>

            </div>

            <button
                class="btn primary"
                style="width:100%;"
                onclick="
                    comprarProduto(
                        ${p.id}
                    )
                "
            >
                Comprar
            </button>
            `;

    } catch (erro) {

        details.innerHTML =
            `
            <div class="message error">
                ${escapeHTML(
                    erro.message
                )}
            </div>
            `;
    }
}


/* =========================
   COMPRAR
========================= */

async function comprarProduto(id) {

    if (!usuario) {

        fecharModal(
            "productModal"
        );

        abrirAuth(
            "login"
        );

        return;
    }

    if (
        !confirm(
            "Deseja criar este pedido?"
        )
    ) {
        return;
    }

    try {

        const resposta =
            await api(
                "/api/orders/" +
                id,
                {
                    method: "POST"
                }
            );

        alert(
            resposta.message ||
            "Pedido criado com sucesso."
        );

        fecharModal(
            "productModal"
        );

        carregarProdutos();

    } catch (erro) {

        alert(
            erro.message
        );
    }
}


/* =========================
   PERFIL
========================= */

async function abrirPerfil() {

    const content =
        document.getElementById(
            "profileContent"
        );

    content.innerHTML =
        `
        <div class="empty">
            Carregando perfil...
        </div>
        `;

    abrirModal(
        "profileModal"
    );

    try {

        const resposta =
            await api(
                "/api/auth/me"
            );

        usuario =
            resposta.user ||
            resposta.usuario ||
            usuario;

        const inicial =
            (
                usuario.username ||
                "U"
            )
                .charAt(0)
                .toUpperCase();

        content.innerHTML =
            `
            <div class="profile">

                <div class="avatar">

                    ${
                        usuario.avatar_url
                            ? `
                                <img
                                    src="${escapeHTML(
                                        usuario.avatar_url
                                    )}"
                                    alt=""
                                >
                            `
                            : inicial
                    }

                </div>

                <div class="profile-info">

                    <h3>
                        ${escapeHTML(
                            usuario.username
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            usuario.email
                        )}
                    </p>

                </div>

            </div>

            <form
                id="profileForm"
                class="form"
            >

                <label>
                    Bio

                    <textarea
                        id="bio"
                        maxlength="500"
                    >${escapeHTML(
                        usuario.bio || ""
                    )}</textarea>

                </label>

                <label>
                    URL da foto de perfil

                    <input
                        id="avatarUrl"
                        type="text"
                        value="${escapeHTML(
                            usuario.avatar_url ||
                            ""
                        )}"
                        placeholder="https://..."
                    >

                </label>

                <div
                    id="profileMessage"
                    class="hidden"
                ></div>

                <button
                    class="btn primary"
                    type="submit"
                >
                    Salvar perfil
                </button>

            </form>

            <div
                style="
                    margin-top:20px;
                    padding:15px;
                    background:#0d1523;
                    border:1px solid #1c2b42;
                    border-radius:10px;
                "
            >

                <strong>
                    Status do vendedor
                </strong>

                <p
                    style="
                        color:#8c9ab0;
                        margin-top:7px;
                        font-size:13px;
                    "
                >
                    ${
                        usuario.seller_verified
                            ? "Vendedor verificado"
                            : "Ainda não verificado"
                    }
                </p>

            </div>
            `;

        document
            .getElementById(
                "profileForm"
            )
            .addEventListener(
                "submit",
                salvarPerfil
            );

    } catch (erro) {

        content.innerHTML =
            `
            <div class="message error">
                ${escapeHTML(
                    erro.message
                )}
            </div>
            `;
    }
}


/* =========================
   SALVAR PERFIL
========================= */

async function salvarPerfil(
    event
) {

    event.preventDefault();

    const message =
        document.getElementById(
            "profileMessage"
        );

    try {

        const bio =
            document
                .getElementById(
                    "bio"
                )
                .value;

        const avatar_url =
            document
                .getElementById(
                    "avatarUrl"
                )
                .value
                .trim();

        const resposta =
            await api(
                "/api/auth/profile",
                {
                    method: "PUT",

                    body:
                        JSON.stringify({
                            bio,
                            avatar_url
                        })
                }
            );

        usuario =
            resposta.user ||
            usuario;

        mostrarMensagem(
            message,
            resposta.message ||
            "Perfil atualizado.",
            "success"
        );

        atualizarInterface();

    } catch (erro) {

        mostrarMensagem(
            message,
            erro.message
        );
    }
}


/* =========================
   PESQUISA
========================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function() {

            clearTimeout(
                searchTimer
            );

            searchTimer =
                setTimeout(
                    function() {
                        carregarProdutos();
                    },
                    350
                );
        }
    );


/* =========================
   INICIAR
========================= */

verificarSessao();

carregarProdutos();

</script>
