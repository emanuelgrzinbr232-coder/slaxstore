<script>
const API_URL = window.location.origin;

let usuario = null;
let authMode = "login";
let categoriaAtual = "";
let produtoAtual = null;
let emailParaVerificacao = "";
let searchTimer = null;


/* =========================
   TOKEN / SESSÃO
========================= */

function obterToken() {
    return localStorage.getItem("slaxstore_token") || "";
}

function salvarToken(token) {
    if (token) {
        localStorage.setItem(
            "slaxstore_token",
            token
        );
    }
}

function removerToken() {
    localStorage.removeItem(
        "slaxstore_token"
    );
}


/* =========================
   API
========================= */

async function api(endpoint, options = {}) {

    const token = obterToken();

    const headers = {
        ...(options.body
            ? {
                "Content-Type":
                    "application/json"
            }
            : {}),
        ...(options.headers || {})
    };

    if (token) {
        headers.Authorization =
            "Bearer " + token;
    }

    const resposta = await fetch(
        API_URL + endpoint,
        {
            ...options,
            credentials: "include",
            headers
        }
    );

    let dados = {};

    try {
        dados = await resposta.json();
    } catch {
        dados = {};
    }

    if (
        resposta.status === 401 &&
        endpoint !== "/api/auth/login" &&
        endpoint !== "/api/auth/register"
    ) {
        usuario = null;
        removerToken();
        atualizarInterface();
    }

    if (!resposta.ok) {
        throw new Error(
            dados.error ||
            dados.message ||
            "Ocorreu um erro."
        );
    }

    return dados;
}


/* =========================
   HTML
========================= */

function escapeHTML(valor) {
    return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================
   DINHEIRO
========================= */

function dinheiro(cents) {
    return (
        Number(cents || 0) / 100
    ).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );
}


/* =========================
   MODAIS
========================= */

function abrirModal(id) {
    document
        .getElementById(id)
        .classList.remove("hidden");
}

function fecharModal(id) {
    document
        .getElementById(id)
        .classList.add("hidden");
}


/* =========================
   MENSAGENS
========================= */

function mostrarMensagem(
    elemento,
    texto,
    tipo = "error"
) {
    elemento.className =
        "message " + tipo;

    elemento.textContent = texto;
}


/* =========================
   LOGIN / CADASTRO
========================= */

function abrirAuth(modo) {

    authMode = modo;

    const title =
        document.getElementById(
            "authTitle"
        );

    const usernameField =
        document.getElementById(
            "usernameField"
        );

    const submit =
        document.getElementById(
            "authSubmit"
        );

    const switchText =
        document.getElementById(
            "authSwitchText"
        );

    const switchButton =
        document.getElementById(
            "authSwitch"
        );

    const message =
        document.getElementById(
            "authMessage"
        );

    message.className = "hidden";

    if (modo === "register") {

        title.textContent =
            "Criar conta";

        usernameField.classList.remove(
            "hidden"
        );

        submit.textContent =
            "Criar conta";

        switchText.textContent =
            "Já possui uma conta?";

        switchButton.textContent =
            "Entrar";

    } else {

        title.textContent =
            "Entrar";

        usernameField.classList.add(
            "hidden"
        );

        submit.textContent =
            "Entrar";

        switchText.textContent =
            "Ainda não tem uma conta?";

        switchButton.textContent =
            "Criar conta";
    }

    abrirModal("authModal");
}


function alternarAuth() {
    abrirAuth(
        authMode === "login"
            ? "register"
            : "login"
    );
}


/* =========================
   LOGIN / CADASTRO
========================= */

document
    .getElementById("authForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const message =
                document.getElementById(
                    "authMessage"
                );

            message.className = "hidden";

            try {

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();

                const password =
                    document
                        .getElementById("password")
                        .value;

                if (authMode === "register") {

                    const username =
                        document
                            .getElementById(
                                "username"
                            )
                            .value
                            .trim();

                    if (!username) {
                        throw new Error(
                            "Informe seu usuário."
                        );
                    }

                    emailParaVerificacao =
                        email;

                    const resposta =
                        await api(
                            "/api/auth/register",
                            {
                                method: "POST",
                                body:
                                    JSON.stringify({
                                        username,
                                        email,
                                        password
                                    })
                            }
                        );

                    document
                        .getElementById(
                            "verifyEmailText"
                        )
                        .textContent =
                        "Enviamos um código para " +
                        email +
                        ".";

                    document
                        .getElementById(
                            "verificationCode"
                        )
                        .value = "";

                    fecharModal("authModal");

                    abrirModal("verifyModal");

                    return;
                }


                /* LOGIN */

                const resposta =
                    await api(
                        "/api/auth/login",
                        {
                            method: "POST",
                            body:
                                JSON.stringify({
                                    email,
                                    password
                                })
                        }
                    );

                if (!resposta.token) {
                    throw new Error(
                        "O servidor não retornou o token de login."
                    );
                }

                salvarToken(
                    resposta.token
                );

                usuario =
                    resposta.user ||
                    resposta.usuario ||
                    null;

                if (!usuario) {
                    throw new Error(
                        "O servidor não retornou os dados do usuário."
                    );
                }

                atualizarInterface();

                fecharModal("authModal");

                carregarProdutos();

            } catch (erro) {

                mostrarMensagem(
                    message,
                    erro.message
                );
            }
        }
    );


/* =========================
   VERIFICAÇÃO
========================= */

document
    .getElementById("verifyForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const message =
                document.getElementById(
                    "verifyMessage"
                );

            message.className = "hidden";

            try {

                const code =
                    document
                        .getElementById(
                            "verificationCode"
                        )
                        .value
                        .trim();

                if (!/^\d{6}$/.test(code)) {
                    throw new Error(
                        "Informe um código de 6 números."
                    );
                }

                const resposta =
                    await api(
                        "/api/auth/verify-email",
                        {
                            method: "POST",
                            body:
                                JSON.stringify({
                                    email:
                                        emailParaVerificacao,
                                    code
                                })
                        }
                    );

                mostrarMensagem(
                    message,
                    resposta.message ||
                    "E-mail verificado com sucesso.",
                    "success"
                );

                setTimeout(() => {

                    fecharModal(
                        "verifyModal"
                    );

                    document
                        .getElementById(
                            "email"
                        )
                        .value =
                        emailParaVerificacao;

                    document
                        .getElementById(
                            "password"
                        )
                        .value = "";

                    abrirAuth("login");

                }, 1000);

            } catch (erro) {

                mostrarMensagem(
                    message,
                    erro.message
                );
            }
        }
    );


/* =========================
   REENVIAR CÓDIGO
========================= */

async function reenviarCodigo() {

    const message =
        document.getElementById(
            "verifyMessage"
        );

    try {

        if (!emailParaVerificacao) {
            throw new Error(
                "E-mail não encontrado."
            );
        }

        const resposta =
            await api(
                "/api/auth/resend-code",
                {
                    method: "POST",
                    body:
                        JSON.stringify({
                            email:
                                emailParaVerificacao
                        })
                }
            );

        mostrarMensagem(
            message,
            resposta.message ||
            "Novo código enviado.",
            "success"
        );

    } catch (erro) {

        mostrarMensagem(
            message,
            erro.message
        );
    }
}


/* =========================
   SESSÃO
========================= */

async function verificarSessao() {

    const token = obterToken();

    if (!token) {
        usuario = null;
        atualizarInterface();
        return;
    }

    try {

        const resposta =
            await api(
                "/api/auth/me"
            );

        usuario =
            resposta.user ||
            resposta.usuario ||
            null;

        if (!usuario) {
            removerToken();
        }

    } catch {

        usuario = null;
        removerToken();
    }

    atualizarInterface();
}


/* =========================
   INTERFACE
========================= */

function atualizarInterface() {

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const profileButton =
        document.getElementById(
            "profileButton"
        );

    const logoutButton =
        document.getElementById(
            "logoutButton"
        );

    if (usuario) {

        loginButton.classList.add(
            "hidden"
        );

        profileButton.classList.remove(
            "hidden"
        );

        logoutButton.classList.remove(
            "hidden"
        );

        adicionarBotaoVender();

    } else {

        loginButton.classList.remove(
            "hidden"
        );

        profileButton.classList.add(
            "hidden"
        );

        logoutButton.classList.add(
            "hidden"
        );

        removerBotaoVender();
    }
}


/* =========================
   BOTÃO VENDER
========================= */

function adicionarBotaoVender() {

    if (
        document.getElementById(
            "sellButton"
        )
    ) {
        return;
    }

    const nav =
        document.querySelector(".nav");

    if (!nav) return;

    const botao =
        document.createElement("button");

    botao.id = "sellButton";
    botao.className = "primary";
    botao.textContent = "Vender";

    botao.onclick =
        abrirCriarAnuncio;

    nav.insertBefore(
        botao,
        document.getElementById(
            "profileButton"
        )
    );
}


function removerBotaoVender() {

    const botao =
        document.getElementById(
            "sellButton"
        );

    if (botao) {
        botao.remove();
    }
}


/* =========================
   LOGOUT
========================= */

async function logout() {

    removerToken();

    usuario = null;

    atualizarInterface();

    carregarProdutos();
}


/* =========================
   CATEGORIAS
========================= */

function selecionarCategoria(
    botao
) {

    document
        .querySelectorAll(".filter")
        .forEach(
            item =>
                item.classList.remove(
                    "active"
                )
        );

    botao.classList.add(
        "active"
    );

    categoriaAtual =
        botao.dataset.category ||
        "";

    carregarProdutos();
}


/* =========================
   PRODUTOS
========================= */

async function carregarProdutos() {

    const container =
        document.getElementById(
            "products"
        );

    const count =
        document.getElementById(
            "productCount"
        );

    const pesquisa =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim();

    container.innerHTML =
        `
        <div class="empty">
            Carregando produtos...
        </div>
        `;

    try {

        const params =
            new URLSearchParams();

        params.set(
            "page",
            "1"
        );

        params.set(
            "limit",
            "40"
        );

        if (pesquisa) {
            params.set(
                "search",
                pesquisa
            );
        }

        if (categoriaAtual) {
            params.set(
                "category",
                categoriaAtual
            );
        }

        const resposta =
            await api(
                "/api/products?" +
                params.toString()
            );

        const produtos =
            resposta.products ||
            resposta.items ||
            [];

        count.textContent =
            `${produtos.length} produto(s)`;

        if (!produtos.length) {

            container.innerHTML =
                `
                <div class="empty">
                    Nenhum produto encontrado.
                </div>
                `;

            return;
        }

        container.innerHTML =
            produtos
                .map(
                    criarCardProduto
                )
                .join("");

    } catch (erro) {

        container.innerHTML =
            `
            <div class="empty">
                Não foi possível carregar os produtos.<br><br>
                ${escapeHTML(
                    erro.message
                )}
            </div>
            `;
    }
}


function criarCardProduto(
    produto
) {

    return `
        <article class="product">

            <div class="product-image">

                ${
                    produto.image_url
                        ? `
                            <img
                                src="${escapeHTML(
                                    produto.image_url
                                )}"
                                alt=""
                            >
                        `
                        : `
                            <span>SLAX</span>
                        `
                }

            </div>

            <div class="product-content">

                <div class="product-category">
                    ${escapeHTML(
                        produto.category
                    )}
                </div>

                <div class="product-title">
                    ${escapeHTML(
                        produto.title
                    )}
                </div>

                <div class="product-description">
                    ${escapeHTML(
                        produto.description
                    )}
                </div>

                <div class="product-bottom">

                    <div class="price">
                        ${dinheiro(
                            produto.price_cents
                        )}
                    </div>

                    <button
                        class="buy"
                        onclick="abrirProduto(${produto.id})"
                    >
                        Ver
                    </button>

                </div>

            </div>

        </article>
    `;
}


/* =========================
   PRODUTO
========================= */

async function abrirProduto(id) {

    const details =
        document.getElementById(
            "productDetails"
        );

    details.innerHTML =
        `
        <div class="empty">
            Carregando...
        </div>
        `;

    abrirModal(
        "productModal"
    );

    try {

        const resposta =
            await api(
                "/api/products/" +
                id
            );

        produtoAtual =
            resposta.product ||
            resposta;

        const p =
            produtoAtual;

        document.getElementById(
            "productModalTitle"
        ).textContent =
            p.title;

        details.innerHTML =
            `
            ${
                p.image_url
                    ? `
                        <img
                            src="${escapeHTML(
                                p.image_url
                            )}"
                            style="
                                width:100%;
                                max-height:260px;
                                object-fit:cover;
                                border-radius:10px;
                                margin-bottom:15px;
                            "
                        >
                    `
                    : ""
            }

            <div class="product-category">
                ${escapeHTML(
                    p.category
                )}
            </div>

            <h3>
                ${escapeHTML(
                    p.title
                )}
            </h3>

            <p
                style="
                    color:#9aa8bc;
                    line-height:1.6;
                    margin:15px 0;
                "
            >
                ${escapeHTML(
                    p.description
                )}
            </p>

            <strong
                style="
                    font-size:25px;
                    display:block;
                    margin-bottom:15px;
                "
            >
                ${dinheiro(
                    p.price_cents
                )}
            </strong>

            <button
                class="btn primary"
                style="width:100%;"
                onclick="comprarProduto(${p.id})"
            >
                Comprar
            </button>
            `;

    } catch (erro) {

        details.innerHTML =
            `
            <div class="message error">
                ${escapeHTML(
                    erro.message
                )}
            </div>
            `;
    }
}


/* =========================
   COMPRAR
========================= */

async function comprarProduto(id) {

    if (!usuario) {

        fecharModal(
            "productModal"
        );

        abrirAuth("login");

        return;
    }

    if (
        !confirm(
            "Deseja criar este pedido?"
        )
    ) {
        return;
    }

    try {

        const resposta =
            await api(
                "/api/orders/" +
                id,
                {
                    method: "POST"
                }
            );

        alert(
            resposta.message ||
            "Pedido criado com sucesso."
        );

        fecharModal(
            "productModal"
        );

        carregarProdutos();

    } catch (erro) {

        alert(
            erro.message
        );
    }
}


/* =========================
   PERFIL
========================= */

    const content =
        document.getElementById(
            "profileContent"
        );

    content.innerHTML =
        `
        <div class="empty">
            Carregando perfil...
        </div>
        `;

    abrirModal(
        "profileModal"
    );

    try {

        const resposta =
            await api(
                "/api/auth/me"
            );

        usuario =
            resposta.user ||
            usuario;

        atualizarInterface();

        const inicial =
            (
                usuario.username ||
                "U"
            )
                .charAt(0)
                .toUpperCase();

        content.innerHTML =
            `
            <div class="profile">

                <div class="avatar">

                    ${
                        usuario.avatar_url
                            ? `
                                <img
                                    src="${escapeHTML(
                                        usuario.avatar_url
                                    )}"
                                    alt=""
                                >
                            `
                            : inicial
                    }

                </div>

                <div class="profile-info">

                    <h3>
                        ${escapeHTML(
                            usuario.username
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            usuario.email
                        )}
                    </p>

                </div>

            </div>

            <form
                id="profileForm"
                class="form"
            >

                <label>
                    Usuário

                    <input
                        id="profileUsername"

                            usuario.username || ""
                        )}"
                    >
                </label>

                <label>
                    Bio

                    <textarea
                        id="bio"
                        maxlength="500"
                    >${escapeHTML(
                        usuario.bio || ""
                    )}</textarea>

                </label>

                <label>
                    URL da foto de perfil

                    <input
                        id="avatarUrl"
                        type="text"
                        value="${escapeHTML(
                            usuario.avatar_url || ""
                        )}"

                    >
                </label>

                <div
                    id="profileMessage"

                ></div>

                    class="btn primary"

                    Salvar perfil
                </button>

            </form>

            <div
                style="

                    background:#0d1523;

                    border-radius:10px;
                "
            >

                <strong>
                    Status do vendedor
                </strong>

                <p
                    style="
                        color:#8c9ab0;
                        margin-top:7px;
                        font-size:13px;
                    "
                >
                    ${
                        usuario.seller_verified
                            ? "Vendedor verificado"
                            : "Ainda não verificado"
                    }
                </p>

            </div>
            `;

        document
            .getElementById(
                "profileForm"
            )
            .addEventListener(
                "submit",
                salvarPerfil
            );

    } catch (erro) {

            `
            <div class="message error">
                ${escapeHTML(
                    erro.message
                )}
            </div>
            `;
    }
}


/* =========================
   SALVAR PERFIL
========================= */

async function salvarPerfil(
    event
) {

    event.preventDefault();

    const message =
        document.getElementById(
            "profileMessage"
        );

    try {

        const username =
            document
                .getElementById(
                    "profileUsername"
                )
                .value
                .trim();

        const bio =
            document
                .getElementById(
                    "bio"
                )
                .value;

        const avatar_url =
            document
                .getElementById(
                    "avatarUrl"
                )
                .value
                .trim();

        const resposta =
            await api(
                "/api/auth/profile",
                {
                    method: "PUT",
                    body:
                        JSON.stringify({
                            username,
                            bio,
                            avatar_url
                        })
                }
            );

        usuario =
            resposta.user ||
            usuario;

        mostrarMensagem(
            message,
            resposta.message ||
            "Perfil atualizado com sucesso.",
            "success"
        );

        atualizarInterface();

    } catch (erro) {

        mostrarMensagem(
            message,
            erro.message
        );
    }
}


/* =========================
   CRIAR ANÚNCIO
========================= */

function abrirCriarAnuncio() {

    }

    abrirModal(

    );

    document.getElementById(

    ).textContent =
        "Criar anúncio";

    document.getElementById(
        "productDetails"
    ).innerHTML =
        `
        <form

        >

                >
            </label>

            <label>
                Descrição

                <textarea
                    id="productDescription"
                    maxlength="5000"
                    required
                    placeholder="Descreva o produto..."
                ></textarea>
            </label>

            <label>
                Categoria

                <select
                    id="productCategory"
                    required
                >
                    <option value="Contas">
                        Contas
                    </option>

                    <option value="Itens">
                        Itens
                    </option>

                    <option value="Serviços">
                        Serviços
                    </option>

                    <option value="Outros">
                        Outros
                    </option>
                </select>
            </label>

            <label>
                Preço em reais

                <input
                    id="productPrice"

async function criarAnuncio(
    event
) {

    event.preventDefault();

    const message =
        document.getElementById(
            "createProductMessage"
        );

    try {

        const title =
            document
                .getElementById(
                    "productTitle"
                )
                .value
                .trim();

        const description =
            document
                .getElementById(
                    "productDescription"
                )
                .value
                .trim();

        const category =
            document
                .getElementById(
                    "productCategory"
                )
                .value;

        const price =
            Number(
                document
                    .getElementById(
                        "productPrice"
                    )
                    .value
            );

        const stock =
            Number(
                document
                    .getElementById(
                        "productStock"
                    )
                    .value
            );

        const image_url =
            document
                .getElementById(
                    "productImage"
                )
                .value
                .trim();

        if (!title) {
            throw new Error(
                "Informe o título."
            );
        }

        if (!description) {
            throw new Error(
                "Informe a descrição."
            );
        }

        if (
            !Number.isFinite(price) ||
            price < 0.97
        ) {
            throw new Error(
                "O preço mínimo é R$ 0,97."
            );
        }

        if (
            !Number.isInteger(stock) ||
            stock < 1
        ) {
            throw new Error(
                "O estoque precisa ser pelo menos 1."
            );
        }

        const resposta =
            await api(
                "/api/products",
                {
                    method: "POST",
                    body:
                        JSON.stringify({
                            title,
                            description,
                            category,
                            price_cents:
                                Math.round(
                                    price * 100
                                ),
                            image_url:
                                image_url ||
                                null,
                            stock,
                            delivery_type:
                                "manual"
                        })
                }
            );

        mostrarMensagem(
            message,
            resposta.message ||
            "Anúncio enviado para análise.",
            "success"
        );

        setTimeout(() => {

            fecharModal(
                "productModal"
            );

            carregarProdutos();

        }, 1200);

    } catch (erro) {

        mostrarMensagem(
            message,
            erro.message
        );
    }
}


/* =========================
   PESQUISA
========================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function() {

            clearTimeout(
                searchTimer
            );

            searchTimer =
                setTimeout(
                    carregarProdutos,
                    350
                );
        }
    );


/* =========================
   INICIAR SITE
========================= */

(async function iniciar() {

    await verificarSessao();

    await carregarProdutos();

})();
</script>
